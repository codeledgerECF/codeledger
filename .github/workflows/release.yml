name: Create Release

# Trigger: push a tag like vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm package
        id: npm_download
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          TARBALL_NAME="codeledger-cli-${VERSION}.tgz"

          echo "Downloading @codeledger/cli@${VERSION} from npm..."

          DOWNLOAD_OK=false

          # Method 1: try npm pack (5 attempts with backoff)
          for attempt in 1 2 3 4 5; do
            echo "--- Attempt $attempt: npm pack ---"
            npm pack "@codeledger/cli@${VERSION}" && true
            TARBALL=$(ls codeledger-cli-*.tgz 2>/dev/null | head -1)
            if [ -n "$TARBALL" ]; then
              echo "✓ Downloaded $TARBALL via npm pack"
              echo "NPM_VERIFIED=true" >> "$GITHUB_ENV"
              echo "NPM_TARBALL=$TARBALL" >> "$GITHUB_ENV"
              DOWNLOAD_OK=true
              break
            fi
            echo "npm pack did not produce a tarball, waiting $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          # Method 2: fallback to direct registry download
          if [ "$DOWNLOAD_OK" != "true" ]; then
            echo "npm pack failed, trying direct registry download..."
            REGISTRY_URL="https://registry.npmjs.org/@codeledger/cli/-/cli-${VERSION}.tgz"
            if curl -fsSL -o "$TARBALL_NAME" "$REGISTRY_URL"; then
              echo "✓ Downloaded $TARBALL_NAME via registry URL"
              echo "NPM_VERIFIED=true" >> "$GITHUB_ENV"
              echo "NPM_TARBALL=$TARBALL_NAME" >> "$GITHUB_ENV"
              DOWNLOAD_OK=true
            fi
          fi

          if [ "$DOWNLOAD_OK" != "true" ]; then
            echo "::error::@codeledger/cli@${VERSION} not found on npm after 5 attempts + direct download. Cannot create release without the package."
            exit 1
          fi

      - name: Verify npm package has no post-publish strip targets
        run: |
          echo "Verifying npm tarball is already hardened..."
          TARBALL="${NPM_TARBALL}"
          WORK_DIR=$(mktemp -d)
          FAIL=0

          # Extract tarball
          tar xzf "$TARBALL" -C "$WORK_DIR"

          MAP_COUNT=$(find "$WORK_DIR" -name '*.js.map' | wc -l)
          if [ "$MAP_COUNT" -gt 0 ]; then
            echo "::error::Published npm tarball contains $MAP_COUNT source map file(s). Refusing to mutate released package."
            FAIL=1
          fi

          DECL_COUNT=0
          while IFS= read -r dts_file; do
            case "$dts_file" in
              */types/dist/*) : ;;
              *) DECL_COUNT=$((DECL_COUNT + 1)) ;;
            esac
          done < <(find "$WORK_DIR" -name '*.d.ts' 2>/dev/null)
          if [ "$DECL_COUNT" -gt 0 ]; then
            echo "::error::Published npm tarball contains $DECL_COUNT internal declaration file(s). Refusing to mutate released package."
            FAIL=1
          fi

          URL_COUNT=$(grep -rl 'sourceMappingURL=' "$WORK_DIR" --include='*.js' | wc -l)
          if [ "$URL_COUNT" -gt 0 ]; then
            echo "::error::Published npm tarball contains $URL_COUNT sourceMappingURL comment(s). Refusing to mutate released package."
            FAIL=1
          fi

          rm -rf "$WORK_DIR"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
          echo "✓ npm tarball is already hardened; no post-publish mutation performed"

      - name: Verify wrapper installs
        # CRITICAL — chicken-and-egg note (added 2026-04-09 after run 24220954958):
        #
        # As of v0.10.6, @codeledger/cli is a thin wrapper. Its postinstall
        # script downloads the hardened binary from THIS public release. But
        # this workflow IS the workflow that creates the public release, so
        # the binary URL doesn't exist yet at this point — postinstall would
        # 404 and fail, killing release.yml before it can `gh release create`.
        # That deadlock prevents v0.10.6 from ever publishing.
        #
        # Fix: set CODELEDGER_SKIP_POSTINSTALL=1 to skip the binary download
        # entirely, then verify the wrapper installed correctly via npm list
        # (no binary invocation needed). The downstream IP leak detection +
        # promote_binaries job in release-dispatch.yml handle the binary side
        # separately.
        env:
          CODELEDGER_SKIP_POSTINSTALL: "1"
        run: |
          npm install -g "./${NPM_TARBALL}"
          INSTALLED_VERSION=$(npm list -g @codeledger/cli --depth=0 2>/dev/null | grep -oE '@codeledger/cli@[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/.*@//')
          echo "Installed wrapper: @codeledger/cli@${INSTALLED_VERSION:-unknown}"

          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch — expected $VERSION, got ${INSTALLED_VERSION:-unknown}"
            exit 1
          fi
          echo "✓ Wrapper installed cleanly (binary fetch skipped — see comment above)"

      - name: Verify no IP leakage in shipped package
        env:
          CODELEDGER_PUBLIC_IP_DENYLIST_SHA256: ${{ secrets.CODELEDGER_PUBLIC_IP_DENYLIST_SHA256 }}
        run: |
          echo "Running IP leak detection on shipped tarball..."
          WORK_DIR=$(mktemp -d)
          tar xzf "${NPM_TARBALL}" -C "$WORK_DIR"
          FAIL=0

          # Check 1: No source maps
          MAP_COUNT=$(find "$WORK_DIR" -name '*.js.map' | wc -l)
          if [ "$MAP_COUNT" -gt 0 ]; then
            echo "::error::FAIL: $MAP_COUNT source map files found in package"
            FAIL=1
          else
            echo "  ✓ No source maps"
          fi

          # Check 2: No internal declaration files (public types package excepted)
          DECL_LEAK=0
          while IFS= read -r dts_file; do
            case "$dts_file" in
              */types/dist/*) : ;;
              *) DECL_LEAK=$((DECL_LEAK + 1)) ;;
            esac
          done < <(find "$WORK_DIR" -name '*.d.ts' 2>/dev/null)
          if [ "$DECL_LEAK" -gt 0 ]; then
            echo "::error::FAIL: $DECL_LEAK internal declaration files found"
            FAIL=1
          else
            echo "  ✓ No internal declarations"
          fi

          # Check 3: No sourceMappingURL comments
          URL_COUNT=$(grep -rl 'sourceMappingURL=' "$WORK_DIR" --include='*.js' | wc -l)
          if [ "$URL_COUNT" -gt 0 ]; then
            echo "::error::FAIL: $URL_COUNT files contain sourceMappingURL comments"
            FAIL=1
          else
            echo "  ✓ No sourceMappingURL comments"
          fi

          # Check 4: No test files (may contain architecture-revealing comments)
          TEST_COUNT=$(find "$WORK_DIR" -name '*.test.*' -o -name '*.spec.*' | wc -l)
          if [ "$TEST_COUNT" -gt 0 ]; then
            echo "::error::FAIL: $TEST_COUNT test files found in package"
            FAIL=1
          else
            echo "  ✓ No test files"
          fi

          # Check 5: No proprietary identifiers ANYWHERE in the package.
          # The secret contains newline-delimited SHA-256 hashes of protected
          # identifiers. The public workflow never stores or prints the names.
          if [ -z "${CODELEDGER_PUBLIC_IP_DENYLIST_SHA256:-}" ]; then
            echo "::error::CODELEDGER_PUBLIC_IP_DENYLIST_SHA256 secret is required for release IP checks"
            FAIL=1
          else
            HASH_FILE=$(mktemp)
            printf '%s\n' "$CODELEDGER_PUBLIC_IP_DENYLIST_SHA256" \
              | sed '/^[[:space:]]*$/d' \
              | sort -u > "$HASH_FILE"
            TOKEN_FILE=$(mktemp)
            grep -RhoE '[A-Za-z_][A-Za-z0-9_]{4,}' "$WORK_DIR" --include='*.js' 2>/dev/null \
              | sort -u \
              | while IFS= read -r token; do
                  printf '%s' "$token" | sha256sum | awk '{print $1}'
                done \
              | sort -u > "$TOKEN_FILE"
            HASH_HITS=$(comm -12 "$HASH_FILE" "$TOKEN_FILE" | wc -l | tr -d ' ')
            rm -f "$HASH_FILE" "$TOKEN_FILE"
            if [ "$HASH_HITS" -gt 0 ]; then
              echo "::error::FAIL: ${HASH_HITS} protected identifier hash match(es) found in package tarball"
              FAIL=1
            else
              echo "  ✓ No protected identifier hash matches found in any .js file"
            fi
          fi

          # Legacy narrow check on the open standalone, kept as a redundancy.
          OPEN_CJS=$(find "$WORK_DIR" -name 'codeledger-open.cjs' | head -1)

          # Check 6: Open standalone size limit (proxy for leak detection)
          # A clean open build should be under 100KB. Any larger suggests
          # proprietary logic leaked in via transitive imports.
          if [ -n "$OPEN_CJS" ]; then
            SIZE=$(wc -c < "$OPEN_CJS" | tr -d ' ')
            if [ "$SIZE" -gt 102400 ]; then
              echo "::error::FAIL: open standalone exceeds size limit ($SIZE bytes)"
              FAIL=1
            else
              echo "  ✓ Open standalone size OK ($SIZE bytes)"
            fi
          fi

          # Internal package references are covered by the private hash-set
          # scan above. Do not publish internal package names in this workflow.

          rm -rf "$WORK_DIR"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::IP leak detection failed — package is not safe to ship"
            exit 1
          fi
          echo "✓ All IP leak checks passed"

      - name: Generate MANIFEST.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG_DATE=$(date -u +"%Y-%m-%d")
          SHA256=$(sha256sum "${NPM_TARBALL}" | cut -d' ' -f1)

          # Read feature list from CHANGELOG.md (everything between first ## and second ##)
          CHANGELOG_SECTION=$(awk '/^## '"${VERSION}"'/{found=1; next} /^## [0-9]/{if(found) exit} found{print}' CHANGELOG.md)

          cat > MANIFEST.md << MANIFEST_EOF
          # CodeLedger v${VERSION} — Release Manifest

          **Release date:** ${TAG_DATE}
          **npm package:** \`@codeledger/cli@${VERSION}\`
          **npm verified:** true
          **Git tag:** v${VERSION}
          **Git commit:** $(git rev-parse --short HEAD)
          **Package checksum (SHA-256):** \`${SHA256}\`

          ---

          ## What's in this zip

          This release zip contains the version-pinned npm wrapper package and release metadata. Installing from the zip avoids an npm registry lookup for the wrapper, but the wrapper may still fetch the matching hardened binary from this GitHub release unless your environment already provides it.

          | File | Purpose |
          |------|---------|
          | \`${NPM_TARBALL}\` | The version-pinned npm wrapper package |
          | \`install.sh\` | Installs from the bundled package (with prerequisite checks) |
          | \`README.md\` | Public product and usage documentation |
          | \`GETTING-STARTED.md\` | Step-by-step setup guide |
          | \`RELEASE_NOTES.md\` | Release-specific notes for this version |
          | \`MANIFEST.md\` | This file — release contents and verification |
          | \`ARCHITECTURE_OVERVIEW.md\` | Public architecture overview |
          | \`LICENSE\` | MIT license (CLI, types, repo scanner, harness) |
          | \`LICENSE-CORE\` | CodeLedger Core License (scoring engine binary) |

          ## How to install

          **Option A: From this bootstrap zip (recommended — pinned wrapper)**
          \`\`\`bash
          unzip codeledger-${VERSION}.zip
          cd codeledger-${VERSION}/
          ./install.sh
          \`\`\`

          The bootstrap zip installs the pinned wrapper from the bundled
          tarball. The wrapper may download the matching hardened binary from
          this GitHub Release unless your environment already provides it.

          **Option B: Directly from npm**
          \`\`\`bash
          npm install -g @codeledger/cli@${VERSION}
          \`\`\`

          ## How to verify

          After installation, confirm the version matches this release:

          \`\`\`bash
          codeledger --version
          # Expected: ${VERSION}

          codeledger doctor
          # Runs 8 health checks on your installation
          \`\`\`

          ## Verify package integrity

          \`\`\`bash
          # Check the bundled package checksum
          sha256sum ${NPM_TARBALL}
          # Expected: ${SHA256}
          \`\`\`

          ## Feature verification

          To verify the v${VERSION} feature set is present in your installed CLI:

          \`\`\`bash
          codeledger --version       # Should show: ${VERSION}
          codeledger doctor          # Runs health checks on your installation
          codeledger scan            # Should index files across all supported languages
          codeledger activate --task "Fix auth for api-gateway"
          \`\`\`

          ## Distribution model

          This is an online bootstrap package, not an offline binary bundle.
          For true offline installation, use a platform-specific offline asset
          that includes the hardened binary, checksums, license, and install
          instructions.

          ## v${VERSION} features
          ${CHANGELOG_SECTION}

          ---

          *Generated automatically by release workflow on ${TAG_DATE}.*
          MANIFEST_EOF

          # Clean leading whitespace from heredoc indentation
          sed -i 's/^          //' MANIFEST.md

      - name: Extract open standalone CLI from package
        run: |
          # Extract the open standalone .cjs from the npm tarball
          # This is the thin open build — safe commands only, no proprietary logic
          WORK_DIR=$(mktemp -d)
          tar xzf "${NPM_TARBALL}" -C "$WORK_DIR"
          # Prefer the open build. Never fall back to the full standalone.
          OPEN_STANDALONE=$(find "$WORK_DIR" -name 'codeledger-open.cjs' | head -1)
          FULL_STANDALONE=$(find "$WORK_DIR" -name 'codeledger-standalone.cjs' | head -1)
          if [ -n "$OPEN_STANDALONE" ]; then
            cp "$OPEN_STANDALONE" codeledger-standalone.cjs
            echo "✓ Using open standalone CLI ($(du -h codeledger-standalone.cjs | cut -f1) — safe commands only)"
            echo "HAS_STANDALONE=true" >> "$GITHUB_ENV"
          elif [ -n "$FULL_STANDALONE" ]; then
            echo "::error::Full standalone found but open standalone is missing. Refusing fail-open public packaging."
            exit 1
          else
            echo "No standalone CLI found in package — bootstrap zip will install the wrapper only"
            echo "HAS_STANDALONE=false" >> "$GITHUB_ENV"
          fi
          rm -rf "$WORK_DIR"

      - name: Gather release assets
        run: |
          STAGING="codeledger-${VERSION}"
          mkdir -p "$STAGING"
          CHANGELOG_SECTION=$(awk '/^## '"${VERSION}"'/{found=1; next} /^## [0-9]/{if(found) exit} found{print}' CHANGELOG.md)

          # Copy the npm package (for npm install -g)
          cp "${NPM_TARBALL}" "$STAGING/"

          # Copy standalone CLI if available (for zero-dependency usage)
          if [ "$HAS_STANDALONE" = "true" ]; then
            mkdir -p "$STAGING/bin"
            cp codeledger-standalone.cjs "$STAGING/bin/"
            echo "  ✓ Standalone CLI included in bin/"
          fi

          # Copy distribution files
          cp install.sh "$STAGING/"
          cp GETTING-STARTED.md "$STAGING/"
          cp README.md "$STAGING/"
          printf '# CodeLedger v%s Release Notes\n\n%s\n' "$VERSION" "${CHANGELOG_SECTION:-See the public changelog for this release.}" > RELEASE_NOTES.md
          cp RELEASE_NOTES.md "$STAGING/"
          cp MANIFEST.md "$STAGING/"
          cp docs/ARCHITECTURE_OVERVIEW.md "$STAGING/" 2>/dev/null || true
          cp LICENSE "$STAGING/" 2>/dev/null || true
          cp LICENSE-CORE "$STAGING/" 2>/dev/null || true
          chmod +x "$STAGING/install.sh"

          # Create zip
          zip -r "codeledger-${VERSION}.zip" "$STAGING/"

          # Also create a generic name for the "latest" download link
          cp "codeledger-${VERSION}.zip" codeledger.zip

          echo "ZIP_VERSIONED=codeledger-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "ZIP_LATEST=codeledger.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > RELEASE_BODY.md << 'RELEASE_BODY'
            ## CodeLedger v${{ env.VERSION }}

            ### Install

            **From the bootstrap zip (pins the wrapper; may download the binary):**
            ```bash
            unzip codeledger-${{ env.VERSION }}.zip
            cd codeledger-${{ env.VERSION }}/
            ./install.sh
            ```

            **Or directly from npm:**
            ```bash
            npm install -g @codeledger/cli@${{ env.VERSION }}
            ```

            **Offline install:**
            Use the platform-specific offline binary asset for your OS/CPU,
            or pre-place the hardened binary and install the wrapper with
            `CODELEDGER_SKIP_POSTINSTALL=1`.

            ### npm verification

            ✅ `@codeledger/cli@${{ env.VERSION }}` verified on npm and bundled in the bootstrap zip.

            ### Verify after install

            ```bash
            codeledger --version    # Should show: ${{ env.VERSION }}
            codeledger doctor       # Runs 8 health checks
            ```

            ### What's in the zip

            The release zip contains the pinned npm wrapper package and public
            release metadata. It is an online bootstrap package, not a
            self-contained offline binary bundle. See `MANIFEST.md` inside the
            zip for checksums and feature verification steps.

            **Zip contents:** `${{ env.NPM_TARBALL }}` · `install.sh` · `README.md` · `GETTING-STARTED.md` · `RELEASE_NOTES.md` · `MANIFEST.md` · `ARCHITECTURE_OVERVIEW.md` · `LICENSE` · `LICENSE-CORE`

            ### Links

            - 📦 [npm: @codeledger/cli](https://www.npmjs.com/package/@codeledger/cli)
            - 📖 [Getting Started Guide](https://github.com/${{ github.repository }}/blob/main/GETTING-STARTED.md)
            - 📋 [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          RELEASE_BODY

          gh release create "${GITHUB_REF_NAME}" \
            "${ZIP_VERSIONED}" \
            "${ZIP_LATEST}" \
            --title "CodeLedger v${VERSION}" \
            --notes-file RELEASE_BODY.md
