<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 360">
  <title id="title">CodeLedger task flow</title>
  <desc id="desc">A large repository and task flow through CodeLedger into a bounded context bundle for an AI coding agent, followed by verification evidence.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }
    svg {
      background: #ffffff;
    }
    .box {
      fill: #f8fafc;
      stroke: #334155;
      stroke-width: 1.5;
    }
    .primary {
      fill: #eff6ff;
      stroke: #2563eb;
    }
    .verify {
      fill: #ecfdf5;
      stroke: #059669;
    }
    .text {
      fill: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 650;
      text-anchor: middle;
    }
    .small {
      fill: #475569;
      font-size: 13px;
      font-weight: 500;
    }
    .arrow {
      stroke: #64748b;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        background: #0f172a;
      }
      .box {
        fill: #111827;
        stroke: #94a3b8;
      }
      .primary {
        fill: #172554;
        stroke: #60a5fa;
      }
      .verify {
        fill: #052e2b;
        stroke: #34d399;
      }
      .text {
        fill: #f8fafc;
      }
      .small {
        fill: #cbd5e1;
      }
      .arrow {
        stroke: #94a3b8;
      }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="box" x="28" y="72" width="150" height="98" rx="8" />
  <text class="text" x="103" y="112">Repository</text>
  <text class="text small" x="103" y="138">Thousands of files</text>

  <rect class="box" x="28" y="208" width="150" height="80" rx="8" />
  <text class="text" x="103" y="242">Task</text>
  <text class="text small" x="103" y="266">Plain English intent</text>

  <path class="arrow" d="M 178 121 H 278" />
  <path class="arrow" d="M 178 248 C 225 248 232 169 278 169" />

  <rect class="primary" x="278" y="98" width="168" height="110" rx="8" />
  <text class="text" x="362" y="142">CodeLedger</text>
  <text class="text small" x="362" y="168">Scan, rank, bound</text>

  <path class="arrow" d="M 446 153 H 546" />

  <rect class="box" x="546" y="80" width="176" height="146" rx="8" />
  <text class="text" x="634" y="122">Context Bundle</text>
  <text class="text small" x="634" y="150">Task-relevant files</text>
  <text class="text small" x="634" y="174">Tests, contracts,</text>
  <text class="text small" x="634" y="196">dependencies, churn</text>

  <path class="arrow" d="M 722 153 H 822" />

  <rect class="primary" x="822" y="72" width="110" height="98" rx="8" />
  <text class="text" x="877" y="110">Agent</text>
  <text class="text small" x="877" y="136">Starts focused</text>

  <path class="arrow" d="M 877 170 V 218" />

  <rect class="verify" x="802" y="218" width="150" height="84" rx="8" />
  <text class="text" x="877" y="252">Verification</text>
  <text class="text small" x="877" y="276">Receipts + evidence</text>
</svg>
